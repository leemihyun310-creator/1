<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>내 업무 플래너</title>
    <meta name="description" content="개인 업무를 등록하고 마감일과 완료 상태를 체계적으로 관리하는 간결한 한국어 업무용 플래너" />
    <meta property="og:title" content="내 업무 플래너" />
    <meta property="og:description" content="개인 업무를 등록하고 마감일과 완료 상태를 체계적으로 관리하는 간결한 한국어 업무용 플래너" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      /* ========================================================
         내 업무 플래너 - 단일 파일 독립형 스타일시트
         - 외부 CDN 의존성 없음 (오프라인 더블클릭 실행 완벽 지원)
         - 깔끔한 흰색 바탕, 선명한 글자, 세련된 파란색 포인트
         ======================================================== */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --primary-light: #eff6ff;
        --primary-border: #bfdbfe;
        
        --bg-page: #f8fafc;
        --bg-card: #ffffff;
        
        --text-main: #0f172a;
        --text-sub: #334155;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --border-focus: #3b82f6;

        --danger: #dc2626;
        --danger-bg: #fef2f2;
        --danger-border: #fecaca;
        --danger-text: #991b1b;

        --warning: #d97706;
        --warning-bg: #fffbeb;
        --warning-border: #fde68a;
        --warning-text: #92400e;

        --success: #059669;
        --success-bg: #ecfdf5;
        --success-border: #a7f3d0;
        --success-text: #065f46;

        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 14px;

        --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
        background-color: var(--bg-page);
        color: var(--text-main);
        line-height: 1.5;
        min-height: 100vh;
        padding: 24px 16px 48px;
        display: flex;
        justify-content: center;
      }

      .app-container {
        width: 100%;
        max-width: 820px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      /* 헤더 영역 */
      .app-header {
        background-color: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        padding: 24px;
        box-shadow: var(--shadow-sm);
      }

      .header-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 12px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-icon {
        width: 44px;
        height: 44px;
        background: linear-gradient(135deg, #2563eb, #1d4ed8);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
      }

      .brand-icon svg {
        width: 26px;
        height: 26px;
      }

      .brand h1 {
        font-size: 24px;
        font-weight: 700;
        color: var(--text-main);
        letter-spacing: -0.5px;
      }

      .today-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        background-color: var(--primary-light);
        border: 1px solid var(--primary-border);
        border-radius: 20px;
        font-size: 13px;
        font-weight: 600;
        color: var(--primary);
      }

      .today-badge svg {
        width: 15px;
        height: 15px;
      }

      /* 기기 저장 안내 배너 */
      .sync-notice {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--text-muted);
        background-color: #f1f5f9;
        border: 1px solid #e2e8f0;
        border-radius: var(--radius-md);
        padding: 10px 14px;
      }

      .sync-notice svg {
        width: 16px;
        height: 16px;
        flex-shrink: 0;
        color: #64748b;
      }

      /* 저장 실패 오류 배너 (기본 숨김) */
      .alert-banner {
        display: none;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        background-color: var(--danger-bg);
        border: 1px solid var(--danger-border);
        border-radius: var(--radius-md);
        color: var(--danger-text);
        font-size: 14px;
        font-weight: 500;
        animation: fadeIn 0.2s ease-in-out;
      }

      .alert-banner.show {
        display: flex;
      }

      .alert-banner-content {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .alert-banner button {
        background: none;
        border: none;
        color: var(--danger-text);
        cursor: pointer;
        padding: 4px;
        font-size: 16px;
        line-height: 1;
      }

      /* 통계 현황판 */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
      }

      .stat-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        padding: 14px 16px;
        box-shadow: var(--shadow-sm);
        cursor: pointer;
        transition: all 0.15s ease;
        text-align: left;
      }

      .stat-card:hover {
        border-color: var(--primary);
        transform: translateY(-1px);
        box-shadow: var(--shadow-md);
      }

      .stat-card.active {
        border-color: var(--primary);
        background-color: var(--primary-light);
      }

      .stat-label {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        margin-bottom: 4px;
      }

      .stat-value {
        font-size: 22px;
        font-weight: 700;
        color: var(--text-main);
      }

      .stat-card.overdue .stat-value {
        color: var(--danger);
      }

      .stat-card.today .stat-value {
        color: var(--warning);
      }

      /* 카드 공통 스타일 */
      .card {
        background-color: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-sm);
        padding: 24px;
      }

      .card-title {
        font-size: 17px;
        font-weight: 700;
        color: var(--text-main);
        margin-bottom: 18px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .card-title svg {
        width: 18px;
        height: 18px;
        color: var(--primary);
      }

      /* 폼 레이아웃 */
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 18px;
      }

      .form-label {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-sub);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .form-label .sub-text {
        font-size: 12px;
        font-weight: 400;
        color: var(--text-muted);
      }

      .text-input {
        width: 100%;
        padding: 12px 14px;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        font-size: 15px;
        color: var(--text-main);
        background-color: #ffffff;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      .text-input:focus {
        outline: none;
        border-color: var(--border-focus);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      }

      .text-input.input-error {
        border-color: var(--danger);
        background-color: #fffafa;
      }

      .text-input.input-error:focus {
        box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15);
      }

      .field-error-msg {
        display: none;
        color: var(--danger);
        font-size: 13px;
        font-weight: 500;
        align-items: center;
        gap: 4px;
      }

      .field-error-msg.show {
        display: flex;
      }

      .field-error-msg svg {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-bottom: 20px;
      }

      /* 우선순위 라디오 그룹 */
      .priority-options {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }

      .priority-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 10px 8px;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        background-color: #ffffff;
        color: var(--text-sub);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s ease;
        user-select: none;
      }

      .priority-btn:hover {
        border-color: #cbd5e1;
        background-color: #f8fafc;
      }

      .priority-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }

      /* 우선순위 상태별 선택 */
      .priority-btn[data-priority="high"] .priority-dot {
        background-color: #dc2626;
      }
      .priority-btn[data-priority="medium"] .priority-dot {
        background-color: #2563eb;
      }
      .priority-btn[data-priority="low"] .priority-dot {
        background-color: #10b981;
      }

      .priority-btn[data-priority="high"].selected {
        border-color: var(--danger-border);
        background-color: var(--danger-bg);
        color: var(--danger-text);
        box-shadow: 0 0 0 1px var(--danger-border);
      }

      .priority-btn[data-priority="medium"].selected {
        border-color: var(--primary-border);
        background-color: var(--primary-light);
        color: var(--primary);
        box-shadow: 0 0 0 1px var(--primary-border);
      }

      .priority-btn[data-priority="low"].selected {
        border-color: var(--success-border);
        background-color: var(--success-bg);
        color: var(--success-text);
        box-shadow: 0 0 0 1px var(--success-border);
      }

      /* 날짜 입력창 및 단축 버튼 */
      .date-input-wrapper {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .date-input-row {
        display: flex;
        gap: 6px;
      }

      .date-input {
        flex: 1;
        padding: 10px 12px;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        font-size: 14px;
        color: var(--text-main);
        background-color: #ffffff;
        font-family: inherit;
      }

      .date-input:focus {
        outline: none;
        border-color: var(--border-focus);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      }

      .clear-date-btn {
        padding: 0 12px;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        background-color: #ffffff;
        color: var(--text-muted);
        font-size: 13px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        white-space: nowrap;
      }

      .clear-date-btn:hover {
        background-color: #f1f5f9;
        color: var(--text-main);
      }

      .date-presets {
        display: flex;
        gap: 6px;
      }

      .preset-chip {
        border: 1px solid var(--border-color);
        background: #f8fafc;
        color: var(--text-sub);
        padding: 3px 8px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.1s ease;
      }

      .preset-chip:hover {
        background: var(--primary-light);
        border-color: var(--primary-border);
        color: var(--primary);
      }

      /* 제출 버튼 */
      .submit-btn {
        width: 100%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background-color: var(--primary);
        color: #ffffff;
        font-size: 16px;
        font-weight: 600;
        padding: 14px 20px;
        border: none;
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: background-color 0.15s ease, transform 0.05s ease, box-shadow 0.15s ease;
        box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
      }

      .submit-btn:hover {
        background-color: var(--primary-hover);
        box-shadow: 0 4px 8px rgba(37, 99, 235, 0.3);
      }

      .submit-btn:active {
        transform: scale(0.99);
      }

      .submit-btn svg {
        width: 18px;
        height: 18px;
      }

      /* 목록 제어 영역: 탭 필터 및 정렬 */
      .list-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-bottom: 16px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--border-color);
      }

      .filter-tabs {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding-bottom: 2px;
      }

      .filter-tab {
        background: none;
        border: 1px solid transparent;
        color: var(--text-muted);
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        white-space: nowrap;
        transition: all 0.15s ease;
      }

      .filter-tab:hover {
        background-color: #f1f5f9;
        color: var(--text-main);
      }

      .filter-tab.active {
        background-color: var(--primary);
        color: #ffffff;
        border-color: var(--primary);
      }

      .sort-select-wrapper {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        color: var(--text-muted);
      }

      .sort-select {
        padding: 6px 10px;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-sm);
        background-color: #ffffff;
        color: var(--text-main);
        font-size: 13px;
        font-family: inherit;
        cursor: pointer;
      }

      .sort-select:focus {
        outline: none;
        border-color: var(--border-focus);
      }

      /* 업무 목록 리스트 */
      .task-list {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .task-item {
        background: #ffffff;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        padding: 16px;
        display: flex;
        align-items: flex-start;
        gap: 14px;
        transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
      }

      .task-item:hover {
        border-color: #cbd5e1;
        box-shadow: var(--shadow-sm);
      }

      .task-item.completed {
        background-color: #fbfcfe;
        border-color: #e2e8f0;
      }

      /* 완료 체크박스 커스텀 */
      .checkbox-container {
        display: flex;
        align-items: center;
        padding-top: 2px;
        flex-shrink: 0;
      }

      .task-checkbox {
        appearance: none;
        -webkit-appearance: none;
        width: 22px;
        height: 22px;
        border: 2px solid #cbd5e1;
        border-radius: 6px;
        background-color: #ffffff;
        cursor: pointer;
        display: grid;
        place-content: center;
        transition: all 0.15s ease;
      }

      .task-checkbox:hover {
        border-color: var(--primary);
      }

      .task-checkbox:checked {
        background-color: var(--primary);
        border-color: var(--primary);
      }

      .task-checkbox:checked::before {
        content: "";
        width: 6px;
        height: 11px;
        border: solid white;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
        margin-bottom: 2px;
      }

      /* 업무 본문 영역 */
      .task-content {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .task-header-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .task-title {
        font-size: 15px;
        font-weight: 600;
        color: var(--text-main);
        word-break: break-word;
        line-height: 1.4;
      }

      .task-item.completed .task-title {
        text-decoration: line-through;
        color: var(--text-muted);
      }

      .task-meta-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 12px;
      }

      /* 배지 스타일 */
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 3px 8px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: -0.2px;
        line-height: 1.2;
      }

      .badge-priority-high {
        background-color: var(--danger-bg);
        color: var(--danger-text);
        border: 1px solid var(--danger-border);
      }

      .badge-priority-medium {
        background-color: var(--primary-light);
        color: var(--primary);
        border: 1px solid var(--primary-border);
      }

      .badge-priority-low {
        background-color: var(--success-bg);
        color: var(--success-text);
        border: 1px solid var(--success-border);
      }

      .badge-due-overdue {
        background-color: var(--danger-bg);
        color: var(--danger-text);
        border: 1px solid var(--danger-border);
        font-weight: 700;
      }

      .badge-due-today {
        background-color: var(--warning-bg);
        color: var(--warning-text);
        border: 1px solid var(--warning-border);
        font-weight: 700;
      }

      .badge-due-normal {
        background-color: #f1f5f9;
        color: var(--text-sub);
        border: 1px solid #e2e8f0;
      }

      .badge-due-none {
        background-color: #f8fafc;
        color: var(--text-muted);
        border: 1px solid #e2e8f0;
      }

      .badge-completed {
        background-color: #f1f5f9;
        color: var(--text-muted);
        border: 1px solid #e2e8f0;
      }

      /* Google 캘린더 연동 스타일 */
      .task-gcal-wrapper {
        margin-top: 8px;
        background-color: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: var(--radius-md);
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .gcal-header-row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .gcal-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 12px;
        background-color: #ffffff;
        border: 1px solid #cbd5e1;
        border-radius: var(--radius-sm);
        color: #1e293b;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.15s ease;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        line-height: 1;
      }

      .gcal-btn:hover:not(.disabled) {
        background-color: #eff6ff;
        border-color: #93c5fd;
        color: var(--primary);
        box-shadow: 0 2px 4px rgba(37, 99, 235, 0.12);
      }

      .gcal-btn.disabled {
        background-color: #f1f5f9;
        border-color: #e2e8f0;
        color: #94a3b8;
        cursor: not-allowed;
        opacity: 0.85;
      }

      .gcal-icon {
        width: 15px;
        height: 15px;
        flex-shrink: 0;
      }

      .gcal-external-icon {
        width: 13px;
        height: 13px;
        color: #64748b;
        flex-shrink: 0;
      }

      .gcal-disabled-hint {
        font-size: 12px;
        font-weight: 600;
        color: #dc2626;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .quick-date-picker {
        padding: 4px 8px;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-sm);
        font-size: 12px;
        font-family: inherit;
        background: #ffffff;
        color: var(--text-main);
        cursor: pointer;
      }

      .quick-date-picker:focus {
        outline: none;
        border-color: var(--border-focus);
      }

      .gcal-notice-box {
        display: flex;
        align-items: flex-start;
        gap: 6px;
        font-size: 11.5px;
        line-height: 1.5;
        color: #475569;
        background-color: #ffffff;
        border: 1px dashed #cbd5e1;
        border-radius: var(--radius-sm);
        padding: 7px 9px;
      }

      .gcal-notice-box svg {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
        margin-top: 1px;
        color: #3b82f6;
      }

      .gcal-notice-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .gcal-notice-text strong {
        color: var(--text-main);
      }

      .gcal-notice-warn {
        color: #b45309;
        font-size: 11px;
      }

      /* 개별 삭제 버튼 */
      .task-actions {
        display: flex;
        align-items: center;
        gap: 4px;
        flex-shrink: 0;
      }

      .delete-btn {
        background: none;
        border: 1px solid transparent;
        color: #94a3b8;
        padding: 8px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s ease;
      }

      .delete-btn:hover {
        background-color: var(--danger-bg);
        color: var(--danger);
        border-color: var(--danger-border);
      }

      .delete-btn svg {
        width: 17px;
        height: 17px;
      }

      /* 빈 상태 (업무가 없을 때 시작 안내) */
      .empty-state {
        padding: 48px 20px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .empty-icon-wrap {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background-color: var(--primary-light);
        color: var(--primary);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 4px;
      }

      .empty-icon-wrap svg {
        width: 32px;
        height: 32px;
      }

      .empty-title {
        font-size: 17px;
        font-weight: 700;
        color: var(--text-main);
      }

      .empty-desc {
        font-size: 14px;
        color: var(--text-muted);
        max-width: 380px;
        line-height: 1.6;
      }

      /* 모달 다이얼로그 (삭제 확인) */
      .modal-backdrop {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: rgba(15, 23, 42, 0.5);
        backdrop-filter: blur(2px);
        z-index: 1000;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }

      .modal-backdrop.show {
        display: flex;
      }

      .modal-box {
        background: #ffffff;
        border-radius: var(--radius-lg);
        width: 100%;
        max-width: 400px;
        padding: 24px;
        box-shadow: var(--shadow-lg);
        animation: scaleUp 0.15s ease-out;
      }

      .modal-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
      }

      .modal-icon-danger {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background-color: var(--danger-bg);
        color: var(--danger);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .modal-icon-danger svg {
        width: 20px;
        height: 20px;
      }

      .modal-title {
        font-size: 17px;
        font-weight: 700;
        color: var(--text-main);
      }

      .modal-desc {
        font-size: 14px;
        color: var(--text-sub);
        margin-bottom: 20px;
        line-height: 1.5;
        word-break: break-all;
      }

      .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }

      .btn-cancel {
        padding: 10px 16px;
        background: #f1f5f9;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-md);
        color: var(--text-sub);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }

      .btn-cancel:hover {
        background: #e2e8f0;
      }

      .btn-danger-confirm {
        padding: 10px 16px;
        background: var(--danger);
        border: none;
        border-radius: var(--radius-md);
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }

      .btn-danger-confirm:hover {
        background: #b91c1c;
      }

      /* 반응형 디자인 최적화 */
      @media (max-width: 640px) {
        body {
          padding: 14px 10px 32px;
        }

        .header-top {
          flex-direction: column;
          align-items: flex-start;
        }

        .stats-grid {
          grid-template-columns: repeat(2, 1fr);
        }

        .form-row {
          grid-template-columns: 1fr;
          gap: 14px;
        }

        .card {
          padding: 18px 14px;
        }

        .task-item {
          padding: 14px 12px;
          gap: 10px;
        }

        .list-controls {
          flex-direction: column;
          align-items: stretch;
        }

        .sort-select-wrapper {
          justify-content: flex-end;
        }
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-4px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes scaleUp {
        from { opacity: 0; transform: scale(0.96); }
        to { opacity: 1; transform: scale(1); }
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      
      <!-- 상단 헤더 영역 -->
      <header class="app-header">
        <div class="header-top">
          <div class="brand">
            <div class="brand-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
                <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
                <path d="m9 14 2 2 4-4"></path>
              </svg>
            </div>
            <div>
              <h1>내 업무 플래너</h1>
            </div>
          </div>
          <div class="today-badge" id="todayBadge" title="사용자 로컬 오늘 날짜">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span id="todayDateText">오늘: 로딩 중...</span>
          </div>
        </div>

        <!-- 브라우저 저장 동기화 안내 문구 (요구사항 필수) -->
        <div class="sync-notice">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          <span>이 브라우저에 저장되며 다른 기기와 자동 동기화되지 않습니다.</span>
        </div>
      </header>

      <!-- 저장 실패 알림 배너 (요구사항: 저장 실패 감지 시 안내) -->
      <div id="saveErrorAlert" class="alert-banner" role="alert">
        <div class="alert-banner-content">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span id="saveErrorMessage">저장되지 않았습니다. 브라우저 저장 공간 또는 설정을 확인해 주세요.</span>
        </div>
        <button type="button" onclick="closeSaveError()" aria-label="닫기">✕</button>
      </div>

      <!-- 상단 현황판 카드 -->
      <section class="stats-grid" aria-label="업무 현황 요약">
        <div class="stat-card active" data-filter="all" onclick="setFilter('all')">
          <div class="stat-label">전체 업무</div>
          <div class="stat-value" id="statTotalCount">0</div>
        </div>
        <div class="stat-card" data-filter="pending" onclick="setFilter('pending')">
          <div class="stat-label">진행 중</div>
          <div class="stat-value" id="statPendingCount">0</div>
        </div>
        <div class="stat-card today" data-filter="today" onclick="setFilter('today')">
          <div class="stat-label">오늘 마감</div>
          <div class="stat-value" id="statTodayCount">0</div>
        </div>
        <div class="stat-card overdue" data-filter="overdue" onclick="setFilter('overdue')">
          <div class="stat-label">기한 지남</div>
          <div class="stat-value" id="statOverdueCount">0</div>
        </div>
      </section>

      <!-- 1. 새 업무 등록 영역 (입력창과 목록 분리) -->
      <section class="card" aria-labelledby="formTitle">
        <h2 id="formTitle" class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="16"></line>
            <line x1="8" y1="12" x2="16" y2="12"></line>
          </svg>
          새 업무 등록
        </h2>

        <form id="taskForm" onsubmit="handleAddTask(event)" novalidate>
          <!-- 업무명 입력 -->
          <div class="form-group">
            <label for="taskTitle" class="form-label">
              <span>업무명 <span style="color: var(--danger)">*</span></span>
              <span class="sub-text">공백 제외 1자 이상</span>
            </label>
            <input
              type="text"
              id="taskTitle"
              class="text-input"
              placeholder="해야 할 업무 내용을 입력하세요 (예: 2분기 예산안 검토 및 승인)"
              autocomplete="off"
            />
            <div id="titleError" class="field-error-msg" role="alert">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
              </svg>
              <span>업무 제목을 입력해 주세요. 공백만으로는 등록할 수 없습니다.</span>
            </div>
          </div>

          <!-- 우선순위 및 마감일 2단 구성 -->
          <div class="form-row">
            <!-- 우선순위 선택 -->
            <div class="form-group" style="margin-bottom: 0;">
              <label class="form-label">
                <span>우선순위</span>
                <span class="sub-text">기본값: 보통</span>
              </label>
              <div class="priority-options" role="radiogroup" aria-label="우선순위 선택">
                <button
                  type="button"
                  class="priority-btn"
                  data-priority="high"
                  onclick="selectPriority('high')"
                  role="radio"
                  aria-checked="false"
                >
                  <span class="priority-dot"></span>
                  <span>높음</span>
                </button>
                <button
                  type="button"
                  class="priority-btn selected"
                  data-priority="medium"
                  onclick="selectPriority('medium')"
                  role="radio"
                  aria-checked="true"
                >
                  <span class="priority-dot"></span>
                  <span>보통</span>
                </button>
                <button
                  type="button"
                  class="priority-btn"
                  data-priority="low"
                  onclick="selectPriority('low')"
                  role="radio"
                  aria-checked="false"
                >
                  <span class="priority-dot"></span>
                  <span>낮음</span>
                </button>
              </div>
            </div>

            <!-- 마감일 선택 (선택사항) -->
            <div class="form-group" style="margin-bottom: 0;">
              <label for="taskDueDate" class="form-label">
                <span>마감일</span>
                <span class="sub-text">선택사항 (미지정 시 '마감일 없음')</span>
              </label>
              <div class="date-input-wrapper">
                <div class="date-input-row">
                  <input
                    type="date"
                    id="taskDueDate"
                    class="date-input"
                  />
                  <button type="button" class="clear-date-btn" onclick="clearDueDate()" title="마감일 지우기">
                    초기화
                  </button>
                </div>
                <div class="date-presets">
                  <button type="button" class="preset-chip" onclick="setPresetDate(0)">오늘</button>
                  <button type="button" class="preset-chip" onclick="setPresetDate(1)">내일</button>
                  <button type="button" class="preset-chip" onclick="setPresetDate(7)">1주일 뒤</button>
                </div>
              </div>
            </div>
          </div>

          <!-- 등록 버튼 -->
          <button type="submit" class="submit-btn" id="submitBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            업무 등록하기
          </button>
        </form>
      </section>

      <!-- 2. 업무 목록 영역 -->
      <section class="card" aria-labelledby="listTitle">
        <div class="list-controls">
          <!-- 탭 필터 -->
          <div class="filter-tabs" role="tablist" aria-label="업무 상태 필터">
            <button type="button" class="filter-tab active" data-filter="all" onclick="setFilter('all')">
              전체 (<span id="tabCountAll">0</span>)
            </button>
            <button type="button" class="filter-tab" data-filter="pending" onclick="setFilter('pending')">
              진행 중 (<span id="tabCountPending">0</span>)
            </button>
            <button type="button" class="filter-tab" data-filter="today" onclick="setFilter('today')">
              오늘 마감 (<span id="tabCountToday">0</span>)
            </button>
            <button type="button" class="filter-tab" data-filter="overdue" onclick="setFilter('overdue')">
              기한 지남 (<span id="tabCountOverdue">0</span>)
            </button>
            <button type="button" class="filter-tab" data-filter="completed" onclick="setFilter('completed')">
              완료 (<span id="tabCountCompleted">0</span>)

              <option value="due_asc">마감일 임박순</option>

        <!-- 업무가 없을 때 시작 안내 (요구사항: 업무가 없으면 시작 안내 표시) -->

              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>

    <!-- 개별 항목 삭제 확인 모달 -->

    <!-- ========================================================
         단일 인라인 JavaScript 로직
         - 로컬 스토리지 실시간 영속화 (등록·변경·완료·삭제 직후 저장)
         - 사용자 로컬 날짜 기준 계산
         - 샘플 데이터 강제 삽입 금지 (처음 빈 목록 시작)
         ======================================================== -->
    <script>
      (function() {
        'use strict';

        // 로컬스토리지 키 명칭
        var STORAGE_KEY = 'my_work_planner_tasks_v1';

        // 앱 상태 (State)
        var tasks = [];
        var currentPriority = 'medium'; // 기본값 보통
        var currentFilter = 'all';      // all, pending, today, overdue, completed
        var currentSort = 'created_desc';
        var taskPendingDeleteId = null;

        // DOM 요소 캐시
        var taskForm = document.getElementById('taskForm');
        var taskTitleInput = document.getElementById('taskTitle');
        var titleError = document.getElementById('titleError');
        var taskDueDateInput = document.getElementById('taskDueDate');
        var taskListEl = document.getElementById('taskList');
        var emptyStateEl = document.getElementById('emptyState');
        var emptyStateTitleEl = document.getElementById('emptyStateTitle');
        var emptyStateDescEl = document.getElementById('emptyStateDesc');
        var todayDateText = document.getElementById('todayDateText');
        var saveErrorAlert = document.getElementById('saveErrorAlert');
        var saveErrorMessage = document.getElementById('saveErrorMessage');
        var deleteModal = document.getElementById('deleteModal');
        var deleteModalDesc = document.getElementById('deleteModalDesc');

        // 통계 요소
        var statTotalEl = document.getElementById('statTotalCount');
        var statPendingEl = document.getElementById('statPendingCount');
        var statTodayEl = document.getElementById('statTodayCount');
        var statOverdueEl = document.getElementById('statOverdueCount');

        // 탭 카운트 요소
        var tabCountAll = document.getElementById('tabCountAll');
        var tabCountPending = document.getElementById('tabCountPending');
        var tabCountToday = document.getElementById('tabCountToday');
        var tabCountOverdue = document.getElementById('tabCountOverdue');
        var tabCountCompleted = document.getElementById('tabCountCompleted');

        // ==========================================
        // 1. 날짜 유틸리티 (사용자 로컬 타임존 기준)
        // ==========================================
        function getTodayLocalString() {
          var now = new Date();
          var year = now.getFullYear();
          var month = String(now.getMonth() + 1).padStart(2, '0');
          var day = String(now.getDate()).padStart(2, '0');
          return year + '-' + month + '-' + day;
        }

        function getFormattedKoreanToday() {
          var now = new Date();
          var days = ['일', '월', '화', '수', '목', '금', '토'];
          var dayName = days[now.getDay()];
          return now.getFullYear() + '년 ' + (now.getMonth() + 1) + '월 ' + now.getDate() + '일 (' + dayName + ')';
        }

        // 마감일 날짜 차이 계산 (일 단위)
        function getDaysDiffFromToday(dueDateStr) {
          if (!dueDateStr) return null;
          var todayStr = getTodayLocalString();
          var todayDate = new Date(todayStr + 'T00:00:00');
          var targetDate = new Date(dueDateStr + 'T00:00:00');
          var diffTime = targetDate.getTime() - todayDate.getTime();
          return Math.round(diffTime / (1000 * 60 * 60 * 24));
        }

        // Google 캘린더 종일 일정용 날짜 포맷 (YYYYMMDD/YYYYMMDD)
        // 종료일은 마감일 다음 날(배타적 종료일)로 계산하며 월말·연말·윤년 정확히 처리
        function formatGoogleCalendarDates(dueDateStr) {
          if (!dueDateStr) return '';
          var parts = dueDateStr.split('-');
          var year = parseInt(parts[0], 10);
          var month = parseInt(parts[1], 10) - 1; // 0부터 시작하는 월
          var day = parseInt(parts[2], 10);

          var startDate = new Date(year, month, day);
          var endDate = new Date(year, month, day + 1); // Date 객체가 월말/연말 다음 날을 자동 계산

          function toYMD(d) {
            var y = d.getFullYear();
            var m = String(d.getMonth() + 1).padStart(2, '0');
            var dd = String(d.getDate()).padStart(2, '0');
            return '' + y + m + dd;
          }

          return toYMD(startDate) + '/' + toYMD(endDate);
        }

        // Google 캘린더 일정 작성 링크 생성 (action=TEMPLATE)
        // URLSearchParams를 통해 한글, 공백, &, 줄바꿈 등 특수문자를 완벽하게 인코딩
        function getGoogleCalendarUrl(task) {
          if (!task.dueDate) return '';
          var datesStr = formatGoogleCalendarDates(task.dueDate);
          var priorityKorean = task.priority === 'high' ? '높음' : (task.priority === 'low' ? '낮음' : '보통');
          var detailsText = '우선순위: ' + priorityKorean + '\n업무 플래너에서 추가한 일정';

          var params = new URLSearchParams();
          params.set('action', 'TEMPLATE');
          params.set('text', task.title);
          params.set('dates', datesStr);
          params.set('details', detailsText);

          return 'https://calendar.google.com/calendar/r/eventedit?' + params.toString();
        }

        // ==========================================
        // 2. 스토리지 저장 및 불러오기
        // ==========================================
        function loadTasks() {
          try {
            var rawData = localStorage.getItem(STORAGE_KEY);
            if (rawData) {
              var parsed = JSON.parse(rawData);
              if (Array.isArray(parsed)) {
                tasks = parsed;
              } else {
                tasks = [];
              }
            } else {
              // 요구사항: 처음에는 빈 목록으로 시작, 새로고침 시 샘플 데이터 추가 금지
              tasks = [];
            }
          } catch (e) {
            console.error('로컬스토리지 로드 실패:', e);
            tasks = [];
            showSaveError('저장된 데이터를 불러오는 중 오류가 발생했습니다.');
          }
        }

        function saveTasks() {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
            hideSaveError();
            return true;
          } catch (e) {
            console.error('로컬스토리지 저장 실패:', e);
            showSaveError('저장되지 않았습니다. 브라우저 저장 공간 또는 설정을 확인해 주세요.');
            return false;
          }
        }

        function showSaveError(msg) {
          if (saveErrorMessage) saveErrorMessage.textContent = msg;
          if (saveErrorAlert) saveErrorAlert.classList.add('show');
        }

        function hideSaveError() {
          if (saveErrorAlert) saveErrorAlert.classList.remove('show');
        }

        window.closeSaveError = function() {
          hideSaveError();
        };

        // ==========================================
        // 3. 입력 폼 제어 및 유효성 검사
        // ==========================================
        window.selectPriority = function(priority) {
          currentPriority = priority;
          var buttons = document.querySelectorAll('.priority-btn');
          buttons.forEach(function(btn) {
            var isTarget = btn.getAttribute('data-priority') === priority;
            btn.classList.toggle('selected', isTarget);
            btn.setAttribute('aria-checked', isTarget ? 'true' : 'false');
          });
        };

        window.clearDueDate = function() {
          taskDueDateInput.value = '';
        };

        window.setPresetDate = function(daysToAdd) {
          var target = new Date();
          target.setDate(target.getDate() + daysToAdd);
          var year = target.getFullYear();
          var month = String(target.getMonth() + 1).padStart(2, '0');
          var day = String(target.getDate()).padStart(2, '0');
          taskDueDateInput.value = year + '-' + month + '-' + day;
        };

        // 업무 추가 처리
        window.handleAddTask = function(e) {
          e.preventDefault();
          var titleVal = taskTitleInput.value;

          // 요구사항 1: 공백만 있는 제목은 막고 이유를 안내
          if (!titleVal || titleVal.trim().length === 0) {
            taskTitleInput.classList.add('input-error');
            titleError.classList.add('show');
            taskTitleInput.focus();
            return;
          }

          // 오류 초기화
          taskTitleInput.classList.remove('input-error');
          titleError.classList.remove('show');

          var newTask = {
            id: 'task_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
            title: titleVal.trim(),
            priority: currentPriority, // high, medium, low
            dueDate: taskDueDateInput.value || null, // YYYY-MM-DD or null
            completed: false,
            createdAt: Date.now()
          };

          // 목록 상단에 새 업무 추가
          tasks.unshift(newTask);

          // 요구사항: 등록 직후 저장
          saveTasks();

          // 입력 폼 초기화 (우선순위는 기본값 '보통'으로 재설정)
          taskTitleInput.value = '';
          taskDueDateInput.value = '';
          selectPriority('medium');
          taskTitleInput.focus();

          render();
        };

        // 입력 중 에러 상태 해제
        taskTitleInput.addEventListener('input', function() {
          if (taskTitleInput.value.trim().length > 0) {
            taskTitleInput.classList.remove('input-error');
            titleError.classList.remove('show');
          }
        });

        // ==========================================
        // 4. 상태 변경 & 삭제
        // ==========================================
        window.toggleTaskComplete = function(id) {
          var found = false;
          for (var i = 0; i < tasks.length; i++) {
            if (tasks[i].id === id) {
              tasks[i].completed = !tasks[i].completed;
              found = true;
              break;
            }
          }
          if (found) {
            // 요구사항: 변경·완료 직후 저장
            saveTasks();
            render();
          }
        };

        // 개별 업무 마감일 설정/변경
        window.setTaskDueDate = function(id, dateStr) {
          if (!dateStr) return;
          var found = false;
          for (var i = 0; i < tasks.length; i++) {
            if (tasks[i].id === id) {
              tasks[i].dueDate = dateStr;
              found = true;
              break;
            }
          }
          if (found) {
            saveTasks();
            render();
          }
        };

        window.openDeleteModal = function(id) {
          var targetTask = null;
          for (var i = 0; i < tasks.length; i++) {
            if (tasks[i].id === id) {
              targetTask = tasks[i];
              break;
            }
          }
          if (!targetTask) return;

          taskPendingDeleteId = id;
          deleteModalDesc.innerHTML = '‘<strong>' + escapeHtml(targetTask.title) + '</strong>’ 업무를 목록에서 삭제하시겠습니까?<br><span style="font-size:12px; color: #64748b;">(삭제 후에는 복구할 수 없습니다.)</span>';
          deleteModal.classList.add('show');
        };

        window.closeDeleteModal = function() {
          taskPendingDeleteId = null;
          deleteModal.classList.remove('show');
        };

        window.confirmDeleteTask = function() {
          if (!taskPendingDeleteId) return;
          var targetId = taskPendingDeleteId;
          tasks = tasks.filter(function(t) {
            return t.id !== targetId;
          });
          // 요구사항: 삭제 직후 저장
          saveTasks();
          closeDeleteModal();
          render();
        };

        // 모달 외부 클릭 시 닫기
        deleteModal.addEventListener('click', function(e) {
          if (e.target === deleteModal) {
            closeDeleteModal();
          }
        });

        // ESC 키로 모달 닫기
        document.addEventListener('keydown', function(e) {
          if (e.key === 'Escape' && deleteModal.classList.contains('show')) {
            closeDeleteModal();
          }
        });

        // ==========================================
        // 5. 필터 및 정렬
        // ==========================================
        window.setFilter = function(filter) {
          currentFilter = filter;
          
          // 탭 버튼 active 갱신
          var tabs = document.querySelectorAll('.filter-tab');
          tabs.forEach(function(tab) {
            tab.classList.toggle('active', tab.getAttribute('data-filter') === filter);
          });

          // 현황판 카드 active 갱신
          var statCards = document.querySelectorAll('.stat-card');
          statCards.forEach(function(card) {
            card.classList.toggle('active', card.getAttribute('data-filter') === filter);
          });

          renderList();
        };

        window.handleSortChange = function() {
          var select = document.getElementById('sortOrder');
          currentSort = select.value;
          renderList();
        };

        // ==========================================
        // 6. 렌더링 파이프라인
        // ==========================================
        function render() {
          updateStats();
          renderList();
        }

        function updateStats() {
          var todayStr = getTodayLocalString();
          var total = tasks.length;
          var pending = 0;
          var todayCount = 0;
          var overdueCount = 0;
          var completedCount = 0;

          tasks.forEach(function(t) {
            if (t.completed) {
              completedCount++;
            } else {
              pending++;
              if (t.dueDate) {
                if (t.dueDate === todayStr) {
                  todayCount++;
                } else if (t.dueDate < todayStr) {
                  overdueCount++;
                }
              }
            }
          });

          // 현황판 숫자 갱신
          statTotalEl.textContent = total;
          statPendingEl.textContent = pending;
          statTodayEl.textContent = todayCount;
          statOverdueEl.textContent = overdueCount;

          // 탭 개수 배지 갱신
          tabCountAll.textContent = total;
          tabCountPending.textContent = pending;
          tabCountToday.textContent = todayCount;
          tabCountOverdue.textContent = overdueCount;
          tabCountCompleted.textContent = completedCount;
        }

        function renderList() {
          var todayStr = getTodayLocalString();

          // 1. 필터링
          var filtered = tasks.filter(function(task) {
            if (currentFilter === 'all') return true;
            if (currentFilter === 'completed') return task.completed;
            if (currentFilter === 'pending') return !task.completed;
            if (currentFilter === 'today') {
              return !task.completed && task.dueDate === todayStr;
            }
            if (currentFilter === 'overdue') {
              // 오늘 이전 날짜의 미완료 업무만
              return !task.completed && task.dueDate && task.dueDate < todayStr;
            }
            return true;
          });

          // 2. 정렬
          filtered.sort(function(a, b) {
            if (currentSort === 'created_desc') {
              return (b.createdAt || 0) - (a.createdAt || 0);
            }
            if (currentSort === 'title_asc') {
              return a.title.localeCompare(b.title, 'ko');
            }
            if (currentSort === 'priority_desc') {
              var pMap = { high: 3, medium: 2, low: 1 };
              var pDiff = (pMap[b.priority] || 2) - (pMap[a.priority] || 2);
              if (pDiff !== 0) return pDiff;
              return (b.createdAt || 0) - (a.createdAt || 0);
            }
            if (currentSort === 'due_asc') {
              // 마감일 있는 항목 우선, 빠른 순서대로, 마감일 없는 항목은 뒤로
              if (!a.dueDate && !b.dueDate) return (b.createdAt || 0) - (a.createdAt || 0);
              if (!a.dueDate) return 1;
              if (!b.dueDate) return -1;
              return a.dueDate.localeCompare(b.dueDate);
            }
            return 0;
          });

          // 3. 목록 DOM 비우기
          taskListEl.innerHTML = '';

          // 4. 빈 목록 처리 (요구사항: 업무가 없으면 시작 안내를 보여줘)
          if (filtered.length === 0) {
            emptyStateEl.style.display = 'flex';
            if (tasks.length === 0) {
              emptyStateTitleEl.textContent = '등록된 업무가 없습니다';
              emptyStateDescEl.textContent = '위의 ‘새 업무 등록’ 창에서 업무명과 우선순위를 지정하여 오늘의 첫 업무를 계획해 보세요.';
            } else {
              emptyStateTitleEl.textContent = '해당 조건의 업무가 없습니다';
              emptyStateDescEl.textContent = '선택한 필터 조건에 일치하는 업무가 없습니다. 다른 탭을 선택해 보세요.';
            }
            return;
          }

          emptyStateEl.style.display = 'none';

          // 5. 항목 생성
          filtered.forEach(function(task) {
            var li = document.createElement('li');
            li.className = 'task-item' + (task.completed ? ' completed' : '');
            li.id = 'task-el-' + task.id;

            // 체크박스
            var checkWrap = document.createElement('div');
            checkWrap.className = 'checkbox-container';
            var checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.className = 'task-checkbox';
            checkbox.checked = !!task.completed;
            checkbox.setAttribute('aria-label', (task.completed ? '완료 취소: ' : '완료 체크: ') + task.title);
            checkbox.addEventListener('change', function() {
              toggleTaskComplete(task.id);
            });
            checkWrap.appendChild(checkbox);

            // 본문 내용 컨테이너
            var contentWrap = document.createElement('div');
            contentWrap.className = 'task-content';

            // 상단 행: 우선순위 배지 + 업무명
            var headerRow = document.createElement('div');
            headerRow.className = 'task-header-row';

            // 우선순위 배지 (요구사항: 색상과 글자로 함께 표시)
            var pBadge = document.createElement('span');
            if (task.priority === 'high') {
              pBadge.className = 'badge badge-priority-high';
              pBadge.textContent = '🔴 높음';
            } else if (task.priority === 'low') {
              pBadge.className = 'badge badge-priority-low';
              pBadge.textContent = '🟢 낮음';
            } else {
              pBadge.className = 'badge badge-priority-medium';
              pBadge.textContent = '🔵 보통';
            }
            headerRow.appendChild(pBadge);

            // 업무 제목
            var titleSpan = document.createElement('span');
            titleSpan.className = 'task-title';
            titleSpan.textContent = task.title;
            headerRow.appendChild(titleSpan);

            contentWrap.appendChild(headerRow);

            // 하단 행: 마감일 및 상태 배지
            var metaRow = document.createElement('div');
            metaRow.className = 'task-meta-row';

            // 날짜 및 상태 판단 규칙 적용:
            // - 오늘 이전 날짜의 미완료 업무에만 ‘기한 지남’
            // - 오늘 날짜는 ‘오늘 마감’
            // - 없으면 ‘마감일 없음’
            // - 완료된 업무는 기한 지남 표시에서 제외
            if (task.completed) {
              var compBadge = document.createElement('span');
              compBadge.className = 'badge badge-completed';
              compBadge.textContent = '✓ 완료됨';
              metaRow.appendChild(compBadge);

              if (task.dueDate) {
                var dateInfo = document.createElement('span');
                dateInfo.style.color = 'var(--text-muted)';
                dateInfo.textContent = '📅 마감일: ' + task.dueDate;
                metaRow.appendChild(dateInfo);
              }
            } else if (!task.dueDate) {
              // 마감일 없음
              var noDateBadge = document.createElement('span');
              noDateBadge.className = 'badge badge-due-none';
              noDateBadge.textContent = '마감일 없음';
              metaRow.appendChild(noDateBadge);
            } else {
              // 마감일이 있는 미완료 업무
              var diff = getDaysDiffFromToday(task.dueDate);
              if (task.dueDate < todayStr) {
                // 기한 지남 (오늘 이전 날짜)
                var overdueBadge = document.createElement('span');
                overdueBadge.className = 'badge badge-due-overdue';
                var daysOver = Math.abs(diff);
                overdueBadge.textContent = '⚠️ 기한 지남 (' + daysOver + '일 경과)';
                metaRow.appendChild(overdueBadge);
              } else if (task.dueDate === todayStr) {
                // 오늘 마감 (오늘을 기한 지남으로 표시하지 마)
                var todayBadge = document.createElement('span');
                todayBadge.className = 'badge badge-due-today';
                todayBadge.textContent = '🔥 오늘 마감 (D-Day)';
                metaRow.appendChild(todayBadge);
              } else {
                // 향후 마감일
                var normalBadge = document.createElement('span');
                normalBadge.className = 'badge badge-due-normal';
                normalBadge.textContent = '📅 D-' + diff + ' (' + task.dueDate + ')';
                metaRow.appendChild(normalBadge);
              }
            }

            contentWrap.appendChild(metaRow);

            // Google 캘린더 연동 영역 생성
            var gcalWrap = document.createElement('div');
            gcalWrap.className = 'task-gcal-wrapper';

            var gcalHeader = document.createElement('div');
            gcalHeader.className = 'gcal-header-row';

            if (task.dueDate) {
              // 마감일이 있는 업무: 활성 링크 버튼 (새 탭으로 열기, rel="noopener noreferrer")
              var gcalUrl = getGoogleCalendarUrl(task);
              var gcalLink = document.createElement('a');
              gcalLink.href = gcalUrl;
              gcalLink.target = '_blank';
              gcalLink.rel = 'noopener noreferrer';
              gcalLink.className = 'gcal-btn';
              gcalLink.title = 'Google 캘린더에서 미리 채워진 일정 작성 열기 (새 탭)';
              gcalLink.innerHTML = '<svg class="gcal-icon" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg><span>Google 캘린더에 추가</span><svg class="gcal-external-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>';
              
              gcalHeader.appendChild(gcalLink);
            } else {
              // 마감일이 없는 업무: 비활성화 버튼 및 '마감일을 먼저 설정해 주세요' 안내
              var gcalDisabledBtn = document.createElement('button');
              gcalDisabledBtn.type = 'button';
              gcalDisabledBtn.className = 'gcal-btn disabled';
              gcalDisabledBtn.disabled = true;
              gcalDisabledBtn.setAttribute('aria-disabled', 'true');
              gcalDisabledBtn.title = '마감일을 먼저 설정해 주세요';
              gcalDisabledBtn.innerHTML = '<svg class="gcal-icon" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg><span>Google 캘린더에 추가</span>';

              var hintWrap = document.createElement('div');
              hintWrap.style.display = 'flex';
              hintWrap.style.alignItems = 'center';
              hintWrap.style.gap = '8px';
              hintWrap.style.flexWrap = 'wrap';

              var hintText = document.createElement('span');
              hintText.className = 'gcal-disabled-hint';
              hintText.textContent = '⚠️ 마감일을 먼저 설정해 주세요';
              hintWrap.appendChild(hintText);

              // 사용자가 목록에서 마감일을 손쉽게 지정할 수 있는 인풋
              var quickDateInput = document.createElement('input');
              quickDateInput.type = 'date';
              quickDateInput.className = 'quick-date-picker';
              quickDateInput.title = '마감일 지정';
              quickDateInput.addEventListener('change', function() {
                if (quickDateInput.value) {
                  setTaskDueDate(task.id, quickDateInput.value);
                }
              });
              hintWrap.appendChild(quickDateInput);

              gcalHeader.appendChild(gcalDisabledBtn);
              gcalHeader.appendChild(hintWrap);
            }

            gcalWrap.appendChild(gcalHeader);

            // 필수 안내 문구 영역 (버튼 근처 안내, 확인 후 저장 및 동기화/중복 안내)
            var gcalNoticeBox = document.createElement('div');
            gcalNoticeBox.className = 'gcal-notice-box';
            gcalNoticeBox.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>' +
              '<div class="gcal-notice-text">' +
                '<div>• <strong>제목</strong>과 <strong>우선순위</strong>가 Google로 전달됩니다.</div>' +
                '<div>• <strong>Google 캘린더에서 확인 후 저장하세요.</strong> 이후 변경은 자동 동기화되지 않습니다.</div>' +
                '<div class="gcal-notice-warn">※ 링크를 열었다고 ‘등록 완료’로 표시되지 않으며, 중복 저장 여부는 자동으로 판단할 수 없습니다.</div>' +
              '</div>';

            gcalWrap.appendChild(gcalNoticeBox);
            contentWrap.appendChild(gcalWrap);

            // 삭제 버튼 (선택한 항목만 삭제)
            var actionWrap = document.createElement('div');
            actionWrap.className = 'task-actions';

            var delBtn = document.createElement('button');
            delBtn.type = 'button';
            delBtn.className = 'delete-btn';
            delBtn.setAttribute('aria-label', '업무 삭제');
            delBtn.title = '이 업무 삭제';
            delBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>';
            delBtn.addEventListener('click', function() {
              openDeleteModal(task.id);
            });
            actionWrap.appendChild(delBtn);

            // 조립
            li.appendChild(checkWrap);
            li.appendChild(contentWrap);
            li.appendChild(actionWrap);

            taskListEl.appendChild(li);
          });
        }

        // XSS 방지 헬퍼
        function escapeHtml(str) {
          if (!str) return '';
          return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
        }

        // ==========================================
        // 7. 앱 시작 (초기화)
        // ==========================================
        function init() {
          // 오늘 날짜 텍스트 표시
          if (todayDateText) {
            todayDateText.textContent = getFormattedKoreanToday();
          }

          // 기본 우선순위 '보통' 설정
          selectPriority('medium');

          // 저장소에서 데이터 로드
          loadTasks();

          // 최초 렌더링
          render();
        }

        // 문서 로드 완료 시 초기화 실행
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', init);
        } else {
          init();
        }

      })();
    </script>
  </body>
</html>
